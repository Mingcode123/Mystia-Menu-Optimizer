[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystia-planner"
version = "0.1.0"
description = "An explainable recipe and cookware planning model for Mystia's Izakaya"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]

[project.scripts]
mystia-planner = "mystia_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
