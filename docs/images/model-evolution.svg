<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2106" viewBox="0 0 1360 2106" style="font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1360" height="2106" fill="white"/><text x="24" y="22" fill="#17263c" font-size="37" font-weight="700" dominant-baseline="text-before-edge">备菜决策：从候选查询到共同厨具规划</text><text x="24" y="88" fill="#5b6a7f" font-size="23" font-weight="400" dominant-baseline="text-before-edge">模型关系与目标变化 · 箭头表示决策定义的递进</text><rect x="24" y="140" width="1312" height="88" rx="10" fill="#edf5ff" stroke="none" stroke-width="2"/><image x="48.0" y="160.0" width="48.0" height="48.0" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="124" y="165.0" fill="#195b9a" font-size="25" font-weight="700" dominant-baseline="text-before-edge">共同输入：料理配方与标签 · 顾客偏好 · 当前流行 · 经验日供给</text><rect x="24" y="252" width="620" height="458" rx="13" fill="white" stroke="#d9e2ee" stroke-width="2"/><rect x="24" y="252" width="7" height="458" rx="3" fill="#195b9a" stroke="none" stroke-width="2"/><rect x="47" y="270" width="44" height="40" rx="7" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="54" y="275" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">01</text><text x="104" y="272" fill="#17263c" font-size="28" font-weight="700" dominant-baseline="text-before-edge">查询达标候选</text><text x="50" y="317" fill="#195b9a" font-size="21" font-weight="700" dominant-baseline="text-before-edge">HTML · index.html</text><text x="50" y="356" fill="#17263c" font-size="25" font-weight="400" dominant-baseline="text-before-edge">给定一位顾客，保留多套料理＋加料方案。</text><text x="50" y="416" fill="#5b6a7f" font-size="22" font-weight="700" dominant-baseline="text-before-edge">准入条件（同时满足）</text><rect x="50" y="459" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="59" y="463" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">•</text><text x="95" y="459" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">喜爱命中 − 厌恶命中达到最低分</text><rect x="50" y="507" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="59" y="511" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">•</text><text x="95" y="507" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">满足必含标签与排除标签要求</text><text x="50" y="565" fill="#17263c" font-size="23" font-weight="400" dominant-baseline="text-before-edge">可选规则：加料等价去重、高级过滤、子集过滤与采购</text><text x="50" y="599" fill="#17263c" font-size="23" font-weight="400" dominant-baseline="text-before-edge">推荐。</text><text x="50" y="647" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">输出候选集合，供玩家选择与导出。</text><rect x="716" y="252" width="620" height="458" rx="13" fill="white" stroke="#d9e2ee" stroke-width="2"/><rect x="716" y="252" width="7" height="458" rx="3" fill="#195b9a" stroke="none" stroke-width="2"/><rect x="739" y="270" width="44" height="40" rx="7" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="746" y="275" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">02</text><text x="796" y="272" fill="#17263c" font-size="28" font-weight="700" dominant-baseline="text-before-edge">按喜好标签配置多套方案</text><text x="742" y="317" fill="#195b9a" font-size="21" font-weight="700" dominant-baseline="text-before-edge">Python · detailedPLAN</text><text x="742" y="356" fill="#17263c" font-size="25" font-weight="400" dominant-baseline="text-before-edge">每个可行目标标签选一套方案；假设日订单在这些</text><text x="742" y="394" fill="#17263c" font-size="25" font-weight="400" dominant-baseline="text-before-edge">标签间均分。</text><text x="742" y="454" fill="#5b6a7f" font-size="22" font-weight="700" dominant-baseline="text-before-edge">方案组合的评价顺序</text><rect x="742" y="497" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="751" y="501" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">1</text><text x="787" y="497" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">预计日食材件数最少</text><rect x="742" y="545" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="751" y="549" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">2</text><text x="787" y="545" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">最低供给余量最大</text><text x="742" y="603" fill="#17263c" font-size="23" font-weight="400" dominant-baseline="text-before-edge">从供给中扣除分摊订单的食材消耗。</text><text x="742" y="651" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">保留并列最少用料候选，再比较组合的供给压力。</text><text x="661.0" y="422.84000000000003" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">自动</text><text x="661.0" y="450.84000000000003" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">选定</text><path d="M650 489.84000000000003 L706 489.84000000000003" fill="none" stroke="#195b9a" stroke-width="3" stroke-linejoin="round"/><polygon points="706,489.84000000000003 694.0,482.84000000000003 694.0,496.84000000000003" fill="#195b9a"/><path d="M1026 717 L1026 802" fill="none" stroke="#195b9a" stroke-width="3" stroke-linejoin="round"/><polygon points="1026,802 1033.0,790.0 1019.0,790.0" fill="#195b9a"/><text x="866.0" y="730" fill="#195b9a" font-size="22" font-weight="700" dominant-baseline="text-before-edge">改变订单分配</text><text x="888.0" y="763" fill="#195b9a" font-size="22" font-weight="700" dominant-baseline="text-before-edge">与第一目标</text><rect x="716" y="812" width="620" height="502" rx="13" fill="white" stroke="#d9e2ee" stroke-width="2"/><rect x="716" y="812" width="7" height="502" rx="3" fill="#195b9a" stroke="none" stroke-width="2"/><rect x="739" y="830" width="44" height="40" rx="7" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="746" y="835" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">03</text><text x="796" y="832" fill="#17263c" font-size="28" font-weight="700" dominant-baseline="text-before-edge">每位顾客配置一套方案</text><text x="742" y="877" fill="#195b9a" font-size="21" font-weight="700" dominant-baseline="text-before-edge">Python · singlePLAN</text><text x="742" y="916" fill="#17263c" font-size="25" font-weight="400" dominant-baseline="text-before-edge">同一方案承担该顾客的全部假设订单。</text><text x="742" y="976" fill="#5b6a7f" font-size="22" font-weight="700" dominant-baseline="text-before-edge">单套方案的评价顺序</text><rect x="742" y="1019" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="751" y="1023" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">1</text><text x="787" y="1019" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">喜爱命中数最多</text><rect x="742" y="1067" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="751" y="1071" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">2</text><text x="787" y="1067" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">每份食材件数最少</text><rect x="742" y="1115" width="30" height="30" rx="5" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="751" y="1119" fill="#195b9a" font-size="19" font-weight="700" dominant-baseline="text-before-edge">3</text><text x="787" y="1115" fill="#195b9a" font-size="24" font-weight="700" dominant-baseline="text-before-edge">最低供给余量最大</text><text x="742" y="1173" fill="#17263c" font-size="23" font-weight="400" dominant-baseline="text-before-edge">订单不再按标签分配，第一目标改为喜好覆盖。</text><text x="742" y="1221" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">日消耗由单份用量乘以假设订单量得到。</text><rect x="24" y="812" width="620" height="502" rx="13" fill="white" stroke="#d9e2ee" stroke-width="2"/><rect x="24" y="812" width="7" height="502" rx="3" fill="#7033a6" stroke="none" stroke-width="2"/><rect x="47" y="830" width="44" height="40" rx="7" fill="#f3edfc" stroke="none" stroke-width="2"/><text x="54" y="835" fill="#7033a6" font-size="24" font-weight="700" dominant-baseline="text-before-edge">04</text><text x="104" y="832" fill="#17263c" font-size="28" font-weight="700" dominant-baseline="text-before-edge">将覆盖收益封顶为 3</text><text x="50" y="877" fill="#7033a6" font-size="21" font-weight="700" dominant-baseline="text-before-edge">Python · cover3</text><text x="50" y="916" fill="#17263c" font-size="25" font-weight="400" dominant-baseline="text-before-edge">仍为每客一套方案；只调整第一目标的奖励。</text><text x="50" y="976" fill="#5b6a7f" font-size="22" font-weight="700" dominant-baseline="text-before-edge">封顶后的评价顺序</text><rect x="50" y="1019" width="30" height="30" rx="5" fill="#f3edfc" stroke="none" stroke-width="2"/><text x="59" y="1023" fill="#7033a6" font-size="19" font-weight="700" dominant-baseline="text-before-edge">1</text><text x="95" y="1019" fill="#7033a6" font-size="24" font-weight="700" dominant-baseline="text-before-edge">覆盖收益最大，最多计 3 项</text><rect x="50" y="1067" width="30" height="30" rx="5" fill="#f3edfc" stroke="none" stroke-width="2"/><text x="59" y="1071" fill="#7033a6" font-size="19" font-weight="700" dominant-baseline="text-before-edge">2</text><text x="95" y="1067" fill="#7033a6" font-size="24" font-weight="700" dominant-baseline="text-before-edge">每份食材件数最少</text><rect x="50" y="1115" width="30" height="30" rx="5" fill="#f3edfc" stroke="none" stroke-width="2"/><text x="59" y="1119" fill="#7033a6" font-size="19" font-weight="700" dominant-baseline="text-before-edge">3</text><text x="95" y="1115" fill="#7033a6" font-size="24" font-weight="700" dominant-baseline="text-before-edge">最低供给余量最大</text><text x="50" y="1173" fill="#17263c" font-size="23" font-weight="400" dominant-baseline="text-before-edge">喜爱命中从 3 增至 4，原始得分可提高，比较收益不再</text><text x="50" y="1207" fill="#17263c" font-size="23" font-weight="400" dominant-baseline="text-before-edge">增加。</text><text x="50" y="1255" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">默认三分准入时：达标后先省料，再比较供给余量。</text><text x="661.0" y="993.9200000000001" fill="#7033a6" font-size="19" font-weight="700" dominant-baseline="text-before-edge">收益</text><text x="661.0" y="1021.9200000000001" fill="#7033a6" font-size="19" font-weight="700" dominant-baseline="text-before-edge">封顶</text><path d="M706 1060.92 L650 1060.92" fill="none" stroke="#7033a6" stroke-width="3" stroke-linejoin="round"/><polygon points="650,1060.92 662.0,1067.92 662.0,1053.92" fill="#7033a6"/><text x="380" y="1342" fill="#17263c" font-size="25" font-weight="700" dominant-baseline="text-before-edge">cover3 的扩展：输出表达与设备条件分别处理</text><path d="M334 1322 L334 1452 L228 1452 L228 1490" fill="none" stroke="#9a4800" stroke-width="3" stroke-linejoin="round"/><polygon points="228,1490 235.0,1478.0 221.0,1478.0" fill="#9a4800"/><path d="M334 1452 L660 1452 L660 1490" fill="none" stroke="#087168" stroke-width="3" stroke-linejoin="round"/><polygon points="660,1490 667.0,1478.0 653.0,1478.0" fill="#087168"/><path d="M660 1452 L1112 1452 L1112 1490" fill="none" stroke="#087168" stroke-width="3" stroke-linejoin="round"/><polygon points="1112,1490 1119.0,1478.0 1105.0,1478.0" fill="#087168"/><rect x="24" y="1497" width="408" height="393" rx="12" fill="#fff3e4" stroke="#d9e2ee" stroke-width="2"/><text x="46" y="1515" fill="#9a4800" font-size="27" font-weight="700" dominant-baseline="text-before-edge">输出表达</text><text x="46" y="1554" fill="#9a4800" font-size="21" font-weight="700" dominant-baseline="text-before-edge">mixedingredients</text><text x="46" y="1591" fill="#17263c" font-size="24" font-weight="400" dominant-baseline="text-before-edge">基础食材与加料合并为五格用料表。</text><text x="46" y="1647" fill="#9a4800" font-size="21" font-weight="700" dominant-baseline="text-before-edge">•</text><text x="79" y="1647" fill="#9a4800" font-size="23" font-weight="700" dominant-baseline="text-before-edge">仅改变展示格式</text><text x="46" y="1693" fill="#9a4800" font-size="21" font-weight="700" dominant-baseline="text-before-edge">•</text><text x="79" y="1693" fill="#9a4800" font-size="23" font-weight="700" dominant-baseline="text-before-edge">方案、目标与计算不变</text><rect x="456" y="1497" width="408" height="393" rx="12" fill="#eaf7f4" stroke="#d9e2ee" stroke-width="2"/><text x="478" y="1515" fill="#087168" font-size="27" font-weight="700" dominant-baseline="text-before-edge">给定厨具条件</text><text x="478" y="1554" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">limitedCookware</text><text x="478" y="1591" fill="#17263c" font-size="24" font-weight="400" dominant-baseline="text-before-edge">玩家指定排除哪些厨具，随后为各</text><text x="478" y="1627" fill="#17263c" font-size="24" font-weight="400" dominant-baseline="text-before-edge">客人选方案。</text><text x="478" y="1683" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">•</text><text x="511" y="1683" fill="#087168" font-size="23" font-weight="700" dominant-baseline="text-before-edge">厨具集合是给定参数</text><text x="478" y="1729" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">•</text><text x="511" y="1729" fill="#087168" font-size="23" font-weight="700" dominant-baseline="text-before-edge">沿用 cover3 的评价顺序</text><rect x="888" y="1497" width="448" height="393" rx="12" fill="#eaf7f4" stroke="#d9e2ee" stroke-width="2"/><text x="910" y="1515" fill="#087168" font-size="27" font-weight="700" dominant-baseline="text-before-edge">选择共同厨具</text><text x="910" y="1554" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">nCookware</text><text x="910" y="1591" fill="#17263c" font-size="24" font-weight="400" dominant-baseline="text-before-edge">选择恰好指定数量的厨具；每个配置</text><text x="910" y="1627" fill="#17263c" font-size="24" font-weight="400" dominant-baseline="text-before-edge">下为各客人选方案。</text><text x="910" y="1683" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">1.</text><text x="943" y="1683" fill="#087168" font-size="23" font-weight="700" dominant-baseline="text-before-edge">汇总覆盖收益最大</text><text x="910" y="1729" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">2.</text><text x="943" y="1729" fill="#087168" font-size="23" font-weight="700" dominant-baseline="text-before-edge">总食材件数最少</text><text x="910" y="1775" fill="#087168" font-size="21" font-weight="700" dominant-baseline="text-before-edge">3.</text><text x="943" y="1775" fill="#087168" font-size="23" font-weight="700" dominant-baseline="text-before-edge">逐客供给余量之和最大</text><text x="910" y="1833" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">配置比较包含无方案顾客的惩罚。</text><text x="30" y="1914" fill="#7033a6" font-size="22" font-weight="700" dominant-baseline="text-before-edge">目标比较顺序：先看第 1 项，只有并列时才比较下一项。</text><text x="30" y="1959" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">订单量是模型假设。PLAN 要求无厌恶命中，并满足设定的喜好门槛。</text><text x="30" y="2004" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">规划范围：按各版本保留的候选比较；供给余量逐客核算，不是跨客共享库存联合优化。</text><text x="30" y="2049" fill="#5b6a7f" font-size="22" font-weight="400" dominant-baseline="text-before-edge">HTML 与 Python 是共享工作簿的独立入口；图示不表示程序调用或精确开发时间线。</text></svg>